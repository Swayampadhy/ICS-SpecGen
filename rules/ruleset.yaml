# ICS-SpecGen mapping ruleset: evidence -> supplier requirement -> IEC 62443.
# IEC 62443 clause IDs must be checked against a licensed copy of 62443-4-1:2018 / 62443-4-2:2019.
# Items marked "(to be confirmed)" in the rationale are the ones PROJECT.md flags as uncertain.
version: 1
thresholds:            # defaults; override per project with --thresholds <file.yaml>
  min_canary_ratio: 0.90
  min_nx_ratio: 1.0
  max_critical_cves: 0
  max_kev_cves: 0
  max_high_cves_network: 5
  min_sbom_identified_ratio: 0.90

# A rule has one check (evidence/op/threshold|value) or several under `checks:` (all must hold).
# Operators: >=  <=  ==  in  empty  not_empty  all_true. Missing or null evidence -> N/A.
rules:
  - id: MS-01
    category: memory_safety
    evidence: hardening.ratios.canary
    op: ">="
    threshold: min_canary_ratio
    severity: high
    requirement: >-
      The supplier shall compile all firmware user-space binaries with stack protection
      (-fstack-protector-strong or equivalent) and provide build-flag evidence with each release.
    acceptance_test: "at least {min_canary_ratio:.0%} of executables carry stack canaries"
    iec62443: ["62443-4-1:SI-2", "62443-4-1:SD-4", "62443-4-2:CR 3.5"]
    rationale: >-
      Stack canaries detect linear stack buffer overflows (the bug class behind the TALOS-2019-0862
      family of iocheckd issues) and turn exploitation into a crash.

  - id: MS-02
    category: memory_safety
    evidence: hardening.network_daemons
    op: all_true
    value: [canary, pie, relro_full, nx]
    severity: critical
    requirement: >-
      The supplier shall harden all network-exposed services with stack canaries, PIE, full RELRO and NX.
    acceptance_test: "every network-facing daemon has canary, PIE, full RELRO and NX"
    iec62443: ["62443-4-1:SI-2", "62443-4-1:SD-4", "62443-4-2:CR 3.5", "62443-4-2:CR 7.7"]
    rationale: >-
      Network daemons are the remotely reachable attack surface; a missing mitigation there matters
      more than in a local CLI tool.

  - id: MS-03
    category: memory_safety
    evidence: hardening.ratios.nx
    op: ">="
    threshold: min_nx_ratio
    severity: high
    requirement: >-
      The supplier shall ensure that no executable stack segments ship in the firmware.
    acceptance_test: "{min_nx_ratio:.0%} of executables have a non-executable stack"
    iec62443: ["62443-4-1:SD-4"]
    rationale: An executable stack makes injected shellcode directly runnable.

  - id: DH-01
    category: dependency_hygiene
    evidence: sbom.identified
    op: ">="
    threshold: min_sbom_identified_ratio
    severity: medium
    requirement: >-
      The supplier shall deliver a machine-readable SBOM (CycloneDX or SPDX) with each release, covering
      at least 90 % of components with version and identifier (purl or CPE).
    acceptance_test: "at least {min_sbom_identified_ratio:.0%} of SBOM components have a version and a purl/CPE"
    iec62443: ["62443-4-1:SM-9"]
    rationale: Without an identified component inventory, vulnerability management is guesswork (SM-9 mapping to be confirmed).

  - id: DH-02
    category: dependency_hygiene
    checks:
      - {evidence: vulns.critical, op: "<=", threshold: max_critical_cves}
      - {evidence: vulns.kev, op: "<=", threshold: max_kev_cves}
    severity: critical
    requirement: >-
      The supplier shall ship no known critical or actively exploited vulnerabilities in third-party
      components at delivery, or provide a VEX statement justifying non-exploitability.
    acceptance_test: "no more than {max_critical_cves} critical and {max_kev_cves} KEV-listed CVEs"
    iec62443: ["62443-4-1:SM-9", "62443-4-1:DM-1..DM-6", "62443-4-1:SVV-3"]
    rationale: Critical and actively exploited CVEs are the most likely entry points in the field.

  - id: DH-03
    category: dependency_hygiene
    evidence: vulns.network_facing_critical_high
    op: "<="
    threshold: max_high_cves_network
    severity: high
    requirement: >-
      The supplier shall remediate high-severity CVEs in network-facing components within an agreed
      SLA (e.g. 90 days).
    acceptance_test: "no more than {max_high_cves_network} critical/high CVEs in network-facing components"
    iec62443: ["62443-4-1:DM-4", "62443-4-1:DM-5", "62443-4-1:SUM-1..SUM-5"]
    rationale: Network-facing components are reachable without local access.

  - id: DH-04
    category: dependency_hygiene
    evidence: sbom.eol_components
    op: empty
    severity: high
    requirement: >-
      The supplier shall not ship components past upstream end-of-life without a documented support arrangement.
    acceptance_test: "no end-of-life components (e.g. OpenSSL 1.x, pre-5.10 kernels)"
    iec62443: ["62443-4-1:SM-9"]
    rationale: End-of-life components no longer receive security fixes.

  - id: CI-01
    category: crypto_integrity
    evidence: integrity.image_signature
    op: "=="
    value: present
    severity: high
    requirement: >-
      The supplier shall provide a signed SHA-256 digest manifest for every firmware release before
      site commissioning.
    acceptance_test: "a vendor signature or signed digest accompanies the image"
    iec62443: ["62443-4-2:CR 3.4", "62443-4-1:SUM-4"]
    rationale: The asset owner needs a way to verify that the image is the one the vendor released.

  - id: CI-02
    category: crypto_integrity
    evidence: integrity.verified_update_mechanism
    op: "=="
    value: present
    severity: critical
    requirement: >-
      The device shall verify the authenticity and integrity of firmware updates before installation.
    acceptance_test: "a signature-verifying update mechanism is present (e.g. RAUC keyring)"
    iec62443: ["62443-4-2:EDR 3.10", "62443-4-2:CR 3.4"]
    rationale: Unsigned updates let anyone with network access replace the firmware.

  - id: CI-03
    category: crypto_integrity
    evidence: integrity.boot_integrity
    op: "=="
    value: present
    severity: medium
    requirement: >-
      The supplier shall document and enable boot-integrity protection (signed FIT, dm-verity or secure boot).
    acceptance_test: "boot-integrity indicators are present"
    iec62443: ["62443-4-2:EDR 3.14"]
    rationale: Without boot integrity, a modified root filesystem persists across reboots.

  - id: SD-01
    category: secure_defaults
    evidence: config.cleartext_services
    op: empty
    severity: high
    requirement: >-
      Clear-text management services (Telnet, FTP, TFTP, rsh, HTTP) shall be disabled by default.
    acceptance_test: "no clear-text services enabled by default"
    iec62443: ["62443-4-2:CR 7.7", "62443-4-2:CR 4.1", "62443-4-1:SD-4"]
    rationale: Clear-text protocols expose credentials and commands on the plant network.

  - id: SD-02
    category: secure_defaults
    checks:
      - {evidence: config.empty_password_accounts, op: empty}
      - {evidence: config.weak_hash_accounts, op: empty}
      - {evidence: config.default_password_accounts, op: empty}
    severity: critical
    requirement: >-
      The device shall force a change of default credentials at first use and store password hashes
      with a modern KDF.
    acceptance_test: "no empty, weakly hashed or documented default passwords"
    iec62443: ["62443-4-2:CR 1.5", "62443-4-2:CR 1.7"]
    rationale: Documented default passwords are the first thing an attacker tries.

  - id: SD-03
    category: secure_defaults
    evidence: config.embedded_private_keys
    op: empty
    severity: critical
    requirement: >-
      Unique key material shall be generated per device at provisioning; no private keys shall be
      shipped in the firmware image.
    acceptance_test: "no private keys in the image"
    iec62443: ["62443-4-2:CR 1.5", "62443-4-2:EDR 3.12"]
    rationale: A key shipped in the image is shared by every device and can be extracted from the download.
